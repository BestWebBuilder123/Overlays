<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909">
<title>Assets</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#141414;--line:#292929;--muted:#888;--red:#ed2939;--white:#f5f5f5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -18%,#351014 0,transparent 43%),var(--bg);color:var(--white);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:28px 22px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#ff4654,#a80e20);display:grid;place-items:center;font-size:21px;font-weight:900}.brand h1{margin:0;font-size:20px;letter-spacing:.14em;font-weight:850}.status{font-size:11px;color:#aaa;letter-spacing:.1em}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#42cf8a;margin-right:8px}
.hero{padding:38px 0 25px}.eyebrow{font-size:11px;color:var(--red);font-weight:800;letter-spacing:.2em}.hero h2{font-size:clamp(32px,5vw,47px);letter-spacing:-.045em;line-height:1.08;margin:9px 0}.hero p{color:#999;margin:0;max-width:540px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0 14px}.crumbs{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.crumb{border:0;background:none;color:#aaa;padding:5px 2px}.crumb:hover,.crumb.current{color:white}.crumb.current{font-weight:700}.slash{color:#555}
.searchwrap{position:relative;flex:0 1 330px;min-width:min(100%,260px)}.searchwrap span{position:absolute;left:13px;top:8px;color:#777;font-size:18px}.search{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:9px;background:#121212;color:white;outline:none}.search:focus{border-color:#a72b37}
.meta{display:flex;justify-content:space-between;color:#777;font-size:12px;padding:0 2px 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}
.item{padding:14px;border:1px solid #292929;border-radius:12px;background:linear-gradient(145deg,#171717,#101010);transition:.18s}.item:hover{border-color:#713039;transform:translateY(-2px)}.itemtop{display:flex;align-items:center;gap:11px}.fileicon{width:42px;height:42px;flex:0 0 42px;border-radius:10px;background:#251316;color:#ff6874;display:grid;place-items:center;font-size:19px}.folder .fileicon{background:#2a1d10;color:#ffc16b}.info{min-width:0;flex:1}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kind,.size{font-size:11px;color:#777}.size{white-space:nowrap}.actions{display:flex;gap:8px;margin-top:13px}.action{flex:1;text-align:center;text-decoration:none;border:1px solid #363636;background:#1b1b1b;color:#ddd;border-radius:8px;padding:7px 9px;font-size:12px}.action:hover{border-color:#a72b37;color:white}.primary{background:#b91f2d;border-color:#c92a38;color:white}.primary:hover{background:#df2938}
.empty,.error,.loading{grid-column:1/-1;text-align:center;padding:42px 18px;border:1px dashed #383838;border-radius:13px;color:#999}.empty strong,.error strong{display:block;color:#eee;font-size:16px;margin-bottom:5px}.error button{margin-top:12px;background:#b91f2d;color:white;border:0;border-radius:8px;padding:9px 14px}
footer{border-top:1px solid var(--line);margin-top:34px;padding-top:16px;color:#666;font-size:11px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.preview{display:none;position:fixed;inset:0;z-index:5;background:#000c;backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:18px}.preview.open{display:flex}.modal{width:min(900px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #393939;border-radius:15px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid #292929}.modalname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.close{width:34px;height:34px;border:1px solid #393939;border-radius:8px;background:#1b1b1b;color:white;font-size:18px}.media{padding:16px;display:grid;place-items:center;min-height:170px}.media video,.media img{max-width:100%;max-height:65vh;border-radius:8px}.media audio{width:min(560px,100%)}.textpreview{width:100%;max-height:65vh;overflow:auto;white-space:pre-wrap;background:#080808;border:1px solid #292929;border-radius:8px;padding:15px;color:#ddd;font:12px/1.6 ui-monospace,monospace}.modalfoot{display:flex;gap:9px;padding:0 16px 16px}
@media(max-width:600px){.shell{padding:19px 14px 40px}.hero{padding-top:30px}.grid{grid-template-columns:1fr}.toolbar{align-items:stretch}.searchwrap{flex-basis:100%}.status{font-size:9px}}
</style></head>
<body><div class="shell">
<header><div class="brand"><div class="mark">A</div><h1>ASSETS</h1></div><div class="status">PUBLIC LIBRARY</div></header>
<section class="hero"><div class="eyebrow">ASSET LIBRARY</div><h2>Browse. Preview.<br><span style="color:var(--red)">Download.</span></h2><p>Explore the collection and find the files you need.</p></section>
<div class="toolbar"><nav class="crumbs" id="crumbs" aria-label="Folder path"></nav><label class="searchwrap"><span>⌕</span><input id="search" class="search" type="search" placeholder="Search this folder…" autocomplete="off"></label></div>
<div class="meta"><span id="folderLabel">ALL FILES</span><span id="count">Loading…</span></div>
<main class="grid" id="grid"><div class="loading">Loading files…</div></main>
<footer><span>ASSETS</span><span>Public file library</span></footer></div>
<div class="preview" id="preview" role="dialog" aria-modal="true"><section class="modal"><header class="modalhead"><div class="modalname" id="modalname"></div><button class="close" id="close" aria-label="Close">×</button></header><div class="media" id="media"></div><div class="modalfoot" id="modalfoot"></div></section></div>
<script>
(()=>{const OWNER='BestWebBuilder123',REPO='overlays',BRANCH='main',API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/',RAW='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/';const grid=document.getElementById('grid'),crumbs=document.getElementById('crumbs'),search=document.getElementById('search'),count=document.getElementById('count'),label=document.getElementById('folderLabel');let path='',entries=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ext=x=>(x.name.split('.').pop()||'').toLowerCase();const size=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?(n/1024).toFixed(1)+' KB':n+' B';const raw=x=>RAW+x.path.split('/').map(encodeURIComponent).join('/');const hidden=x=>x.name.toLowerCase()==='readme.md';const icon=x=>x.type==='dir'?'▰':({mp4:'▶',webm:'▶',mov:'▶',png:'▧',jpg:'▧',jpeg:'▧',gif:'▧',webp:'▧',mp3:'♫',wav:'♫',ogg:'♫',txt:'≡',json:'{ }',js:'JS',css:'#',html:'</>',pdf:'PDF',zip:'ZIP'}[ext(x)]||'◈');
function renderCrumbs(){let p=path?path.split('/'):[],h='<button class="crumb '+(!path?'current':'')+'" data-depth="0">Library</button>';p.forEach((v,i)=>h+='<span class="slash">/</span><button class="crumb '+(i===p.length-1?'current':'')+'" data-depth="'+(i+1)+'">'+esc(v)+'</button>');crumbs.innerHTML=h;crumbs.querySelectorAll('button').forEach(b=>b.onclick=()=>{path=p.slice(0,Number(b.dataset.depth)).join('/');load()})}
async function load(){grid.innerHTML='<div class="loading">Loading files…</div>';count.textContent='';label.textContent=path?path.toUpperCase():'ALL FILES';renderCrumbs();search.value='';try{let r=await fetch(API+path.split('/').map(encodeURIComponent).join('/')+'?ref='+BRANCH,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error(r.status===403?'GitHub rate limit reached. Try again shortly.':'Could not load this folder (HTTP '+r.status+').');let d=await r.json();entries=(Array.isArray(d)?d:[]).filter(x=>!hidden(x));entries.sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):a.type==='dir'?-1:1);render()}catch(e){grid.innerHTML='<div class="error"><strong>Unable to load files</strong>'+esc(e.message)+'<br><button id="retry">Try again</button></div>';document.getElementById('retry').onclick=load}}
function render(){let q=search.value.trim().toLowerCase(),list=entries.filter(x=>x.name.toLowerCase().includes(q));count.textContent=list.length+' item'+(list.length===1?'':'s');if(!list.length){grid.innerHTML='<div class="empty"><strong>'+(q?'No matches found':'This folder is empty')+'</strong>'+(q?'Try a different search.':'There are no files in this folder yet.')+'</div>';return}grid.innerHTML=list.map(x=>{let dir=x.type==='dir';return '<article class="item '+(dir?'folder':'')+'"><div class="itemtop"><div class="fileicon">'+icon(x)+'</div><div class="info"><div class="name" title="'+esc(x.name)+'">'+esc(x.name)+'</div><div class="kind">'+(dir?'FOLDER':ext(x).toUpperCase()+' FILE')+'</div></div><span class="size">'+(dir?'':size(x.size||0))+'</span></div><div class="actions">'+(dir?'<button class="action primary folderbtn" data-path="'+esc(x.path)+'">Open folder →</button>':'<button class="action previewbtn" data-path="'+esc(x.path)+'">Preview</button><a class="action primary" href="'+esc(raw(x))+'" download="'+esc(x.name)+'" target="_blank" rel="noopener">Download ↓</a>')+'</div></article>'}).join('');grid.querySelectorAll('.folderbtn').forEach(b=>b.onclick=()=>{path=b.dataset.path;load()});grid.querySelectorAll('.previewbtn').forEach(b=>b.onclick=()=>{let x=entries.find(v=>v.path===b.dataset.path);if(x)preview(x)})}
function preview(x){let u=raw(x),e=ext(x),m=document.getElementById('media');document.getElementById('modalname').textContent=x.name;let h='';if(['mp4','webm','mov','m4v','ogv'].includes(e))h='<video controls autoplay playsinline src="'+esc(u)+'"></video>';else if(['png','jpg','jpeg','gif','webp','svg','avif'].includes(e))h='<img src="'+esc(u)+'" alt="'+esc(x.name)+'">';else if(['mp3','wav','ogg','m4a','aac','flac'].includes(e))h='<audio controls autoplay src="'+esc(u)+'"></audio>';else if(['txt','md','json','js','css','html','xml','csv','yml','yaml','log','srt','vtt'].includes(e)){h='<div class="textpreview">Loading preview…</div>';fetch(u).then(r=>r.text()).then(t=>{let p=m.querySelector('.textpreview');if(p)p.textContent=t.slice(0,60000)+(t.length>60000?'\n[Preview truncated]':'')}).catch(()=>{let p=m.querySelector('.textpreview');if(p)p.textContent='Preview unavailable.'})}else h='<div style="color:#999;text-align:center;padding:30px">Preview is not available for this file type.</div>';m.innerHTML=h;document.getElementById('modalfoot').innerHTML='<a class="action primary" href="'+esc(u)+'" download="'+esc(x.name)+'" target="_blank" rel="noopener">Download file ↓</a><a class="action" href="'+esc(u)+'" target="_blank" rel="noopener">Open original ↗</a>';document.getElementById('preview').classList.add('open')}
function close(){document.getElementById('preview').classList.remove('open');document.getElementById('media').innerHTML=''}document.getElementById('close').onclick=close;document.getElementById('preview').onclick=e=>{if(e.target.id==='preview')close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});search.oninput=render;load()})();
</script></body></html>
